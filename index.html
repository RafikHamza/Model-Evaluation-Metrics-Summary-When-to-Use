<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Learning Basics: Understanding Evaluation Metrics</title>
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; line-height: 1.6; }
    .slide { position: relative; display: none; padding: 40px; box-sizing: border-box; height: 100vh; background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%); color: #333; overflow-y: auto; }
    .slide.active { display: block; }
    .controls { position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 100; }
    button { padding: 10px 20px; font-size: 16px; margin: 0 10px; background-color: #4a6fa5; color: white; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s; }
    button:hover { background-color: #3a5a8c; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background: #4a6fa5; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    .page-number { position: absolute; bottom: 10px; right: 20px; font-size: 14px; color: #666; }
    .large-text { font-size: 1.6em; text-align: center; margin: 25px 0; color: #2c4060; }
    .example-box { background: #fff; border-left: 4px solid #4a6fa5; padding: 15px; margin: 20px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .definition { background-color: #e8f0fe; border-radius: 5px; padding: 10px 15px; margin: 10px 0; }
    .comparison { display: flex; justify-content: space-around; margin: 20px 0; }
    .comparison div { flex: 1; padding: 15px; text-align: center; }
    .highlight { color: #e63946; font-weight: bold; }
    .two-column { display: flex; gap: 20px; }
    .two-column div { flex: 1; }
    h1, h2 { color: #2c4060; }
    ul, ol { padding-left: 25px; }
    li { margin-bottom: 8px; }
    .progress-container { width: 100%; background-color: #ddd; border-radius: 5px; margin: 10px 0; }
    .progress-bar { height: 20px; background-color: #4CAF50; border-radius: 5px; text-align: center; color: white; line-height: 20px; }
    .matrix-container { display: flex; justify-content: center; margin: 20px 0; }
    .matrix { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; width: 400px; height: 300px; }
    .matrix-cell { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; border: 1px solid #ccc; text-align: center; }
    .tp { background-color: #c8e6c9; }
    .fp { background-color: #ffecb3; }
    .fn { background-color: #ffccbc; }
    .tn { background-color: #bbdefb; }
  </style>
</head>
<body>
  <div id="slides">
    <!-- Slides omitted for brevity, keep previous slide markup unchanged -->
    <!-- ... Slide 15 ... -->
  </div>
  <div class="controls">
    <button id="prev">&lt; Previous</button>
    <button id="next">Next &gt;</button>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const slides = document.querySelectorAll('.slide');
      let index = 0;
      function showSlide(i) {
        slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
      }
      document.getElementById('next').addEventListener('click', function() {
        index = (index + 1) % slides.length;
        showSlide(index);
      });
      document.getElementById('prev').addEventListener('click', function() {
        index = (index - 1 + slides.length) % slides.length;
        showSlide(index);
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight') document.getElementById('next').click();
        if (e.key === 'ArrowLeft') document.getElementById('prev').click();
      });
    });
  </script>
</body>
</html>
